# yazi theme: fathom (Fathom palette).
# Auto-rendered from theme.toml.template by ~/.xmonad/bin/gen-fathom-colors.sh.
# Do not edit theme.toml directly; edit this template and recompile xmonad (M-C-r).
# Schema: https://yazi-rs.github.io/docs/configuration/theme  (uses [mgr], [cmp], [pick])

[mgr]
cwd = { fg = "#6EA0F9" }

# Hovered file/dir -> inverse onto the white accent
hovered         = { fg = "#282C34", bg = "#F5F1E8" }
preview_hovered = { underline = true }

# Find (search-in-directory)
find_keyword  = { fg = "#FFA829", italic = true }
find_position = { fg = "#B97AD7", bg = "reset", italic = true }

# Yank / selection markers (the thin gutter bar)
marker_copied   = { fg = "#88BD69", bg = "#88BD69" }
marker_cut      = { fg = "#F93D53", bg = "#F93D53" }
marker_marked   = { fg = "#6EA0F9",  bg = "#6EA0F9" }
marker_selected = { fg = "#FFA829",  bg = "#FFA829" }

# Tabs
tab_active   = { fg = "#282C34",     bg = "#F5F1E8" }
tab_inactive = { fg = "#D4D4D4", bg = "#42464D" }
tab_width    = 1

# Operation counters
count_copied   = { fg = "#282C34", bg = "#88BD69" }
count_cut      = { fg = "#282C34", bg = "#F93D53" }
count_selected = { fg = "#282C34", bg = "#FFA829" }

# Borders
border_symbol = "│"
border_style  = { fg = "#5E6167" }

[mode]
normal_main = { fg = "#282C34", bg = "#6EA0F9",    bold = true }
normal_alt  = { fg = "#6EA0F9",  bg = "#42464D" }
select_main = { fg = "#282C34", bg = "#88BD69",   bold = true }
select_alt  = { fg = "#88BD69", bg = "#42464D" }
unset_main  = { fg = "#282C34", bg = "#B97AD7",  bold = true }
unset_alt   = { fg = "#B97AD7", bg = "#42464D" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#F5F1E8", bold = true }
progress_normal = { fg = "#6EA0F9",  bg = "#42464D" }
progress_error  = { fg = "#F93D53", bg = "#42464D" }

perm_type  = { fg = "#6EA0F9" }
perm_read  = { fg = "#FFA829" }
perm_write = { fg = "#F93D53" }
perm_exec  = { fg = "#88BD69" }
perm_sep   = { fg = "#959595" }

[input]
border   = { fg = "#6EA0F9" }
title    = {}
value    = {}
selected = { reversed = true }

[pick]
border   = { fg = "#6EA0F9" }
active   = { fg = "#B97AD7", bold = true }
inactive = {}

[confirm]
border  = { fg = "#6EA0F9" }
title   = { fg = "#6EA0F9" }
content = {}
list    = {}
btn_yes = { fg = "#282C34", bg = "#F5F1E8", bold = true }
btn_no  = {}

[cmp]
border = { fg = "#6EA0F9" }

[tasks]
border  = { fg = "#6EA0F9" }
title   = {}
hovered = { fg = "#B97AD7", underline = true }

[which]
mask            = { bg = "#11141C" }
cand            = { fg = "#4D9393" }
rest            = { fg = "#959595" }
desc            = { fg = "#B97AD7" }
separator       = "  "
separator_style = { fg = "#5E6167" }

[help]
on      = { fg = "#B97AD7" }
run     = { fg = "#4D9393" }
desc    = { fg = "#D4D4D4" }
hovered = { bg = "#42464D", bold = true }
footer  = { fg = "#282C34", bg = "#D4D4D4" }

[notify]
title_info  = { fg = "#88BD69" }
title_warn  = { fg = "#FFA829" }
title_error = { fg = "#F93D53" }

[filetype]
rules = [
  { mime = "image/*", fg = "#FFA829" },
  { mime = "video/*", fg = "#B97AD7" },
  { mime = "audio/*", fg = "#B97AD7" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#F93D53" },
  { mime = "application/{pdf,doc,rtf}", fg = "#88BD69" },
  { url = "*", is = "orphan", fg = "#F93D53" },
  { url = "*", is = "exec",   fg = "#88BD69" },
  { url = "*/", fg = "#6EA0F9" },
]
