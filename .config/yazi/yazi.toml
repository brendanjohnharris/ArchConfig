# yazi — terminal file manager. https://yazi-rs.github.io/docs/configuration/yazi
# Colours are themed separately in theme.toml (rendered from theme.toml.template).
[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
tab_size   = 2
max_width  = 1200
max_height = 1200

# Open PDFs in the fathom-themed sioyek reader; keep the default openers otherwise.
[opener]
pdf = [
  { run = 'sioyek "$@"', desc = "sioyek", orphan = true },
]

[open]
prepend_rules = [
  { mime = "application/pdf", use = "pdf" },
]
